name: QA Atlas CI
'on':
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-backend:
    name: Node 24 · build and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:syntax
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  ml-service:
    name: Python 3.12 · generation and document checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r ml-service/requirements.lock.txt pytest==8.3.5 coverage==7.8.0 docker==7.1.0
      - run: npm install --prefix /tmp/atlas-runner @playwright/test@1.58.2 c8@10.1.3
      - run: python -m pytest ml-service/tests runner -q
        env:
          PYTHONPATH: ml-service
          RUNNER_NODE_MODULES: /tmp/atlas-runner/node_modules
